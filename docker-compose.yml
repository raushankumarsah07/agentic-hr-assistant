services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["8000:8000"]
    env_file: .env
    volumes: ["./backend/data:/app/data", "chroma_data:/app/chroma_db", "sqlite_data:/app/checkpoints.sqlite"]
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  chroma_data:
  sqlite_data:
